experiment:
  name: naca0012_graph_unet
  dataset: naca0012_l4_sa
model:
  name: graph_unet
  in_dim: 6
  edge_dim: 4
  condition_dim: 2
  out_dim: 4
  hidden_dim: 128
  n_layers: 6
  dropout: 0.1
  pool_ratio: 0.5
training:
  seed: 42
  n_epochs: 300
  batch_size: 1
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  patience: 40
  field_weights: [1.0, 1.0, 1.0, 1.0]
evaluation:
  metrics: [normalized_rmse, relative_l2, parameter_count, inference_time, worst_case]
