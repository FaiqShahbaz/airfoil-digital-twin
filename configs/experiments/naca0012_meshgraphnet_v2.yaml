experiment:
  name: naca0012_meshgraphnet_v2
  dataset: naca0012_l4_sa_v2
model:
  name: meshgraphnet
  in_dim: 6
  edge_dim: 5
  condition_dim: 2
  out_dim: 4
  hidden_dim: 128
  n_layers: 8
  dropout: 0.1
  use_global_context: true
training:
  seed: 42
  n_epochs: 300
  batch_size: 1
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  patience: 40
  field_weights: [1.0, 1.0, 1.0, 1.0]
evaluation:
  metrics: [normalized_rmse, physical_mae, physical_rmse, relative_l2, regional_rmse, volume_rmse, parameter_count, inference_time]
