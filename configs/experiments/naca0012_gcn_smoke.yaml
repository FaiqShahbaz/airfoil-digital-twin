experiment:
  name: naca0012_gcn_smoke
  dataset: naca0012_l4_sa
model:
  name: gcn
  in_dim: 6
  edge_dim: 4
  condition_dim: 2
  out_dim: 4
  hidden_dim: 32
  n_layers: 2
  dropout: 0.0
training:
  seed: 42
  n_epochs: 2
  batch_size: 1
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  patience: 2
  field_weights: [1.0, 1.0, 1.0, 1.0]
evaluation:
  metrics: [normalized_rmse, relative_l2]
