# Runtime configuration for a trained NACA0012 surrogate digital twin.
digital_twin:
  name: naca0012_surrogate
  model_checkpoint: checkpoints/naca0012/best.pt
  dataset_stats: data/processed/naca0012_l4_sa/normalization_stats.json
  graph_template: data/processed/naca0012_l4_sa/graph_template.pt
  valid_aoa_deg: [-4.0, 16.0]
  valid_re: [3000000.0, 9000000.0]
  warn_out_of_domain: true
