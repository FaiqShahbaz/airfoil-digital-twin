<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="270" viewBox="0 0 1400 270" role="img" aria-labelledby="title desc">
  <title id="title">CFD dataset production pipeline</title>
  <desc id="desc">NACA0012 references and fixed physics pass through validation studies, parametric OpenFOAM runs, quality control, physical-v2 export, and checksum handoff.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/></marker>
    <style>
      .box{rx:14;stroke-width:2}.t{font:600 18px system-ui,sans-serif;fill:#102a43}.s{font:14px system-ui,sans-serif;fill:#334e68}.a{stroke:#4b5563;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="270" fill="#f8fafc"/>
  <rect class="box" x="25" y="70" width="190" height="120" fill="#e0f2fe" stroke="#0284c7"/><text class="t" x="120" y="112" text-anchor="middle">References</text><text class="s" x="120" y="142" text-anchor="middle">NASA TMR</text><text class="s" x="120" y="164" text-anchor="middle">Ladson / Gregory</text>
  <line class="a" x1="215" y1="130" x2="245" y2="130"/>
  <rect class="box" x="255" y="70" width="190" height="120" fill="#dcfce7" stroke="#16a34a"/><text class="t" x="350" y="106" text-anchor="middle">Validation</text><text class="s" x="350" y="136" text-anchor="middle">Mesh · turbulence</text><text class="s" x="350" y="158" text-anchor="middle">AoA · convergence</text>
  <line class="a" x1="445" y1="130" x2="475" y2="130"/>
  <rect class="box" x="485" y="70" width="190" height="120" fill="#fef3c7" stroke="#d97706"/><text class="t" x="580" y="106" text-anchor="middle">100 CFD cases</text><text class="s" x="580" y="136" text-anchor="middle">L4 · SA · 10,000</text><text class="s" x="580" y="158" text-anchor="middle">AoA/Re design</text>
  <line class="a" x1="675" y1="130" x2="705" y2="130"/>
  <rect class="box" x="715" y="70" width="190" height="120" fill="#fee2e2" stroke="#dc2626"/><text class="t" x="810" y="106" text-anchor="middle">QC + review</text><text class="s" x="810" y="136" text-anchor="middle">Forces · y+ · fields</text><text class="s" x="810" y="158" text-anchor="middle">Provenance labels</text>
  <line class="a" x1="905" y1="130" x2="935" y2="130"/>
  <rect class="box" x="945" y="70" width="190" height="120" fill="#ede9fe" stroke="#7c3aed"/><text class="t" x="1040" y="106" text-anchor="middle">Physical-v2</text><text class="s" x="1040" y="136" text-anchor="middle">Fields + volumes</text><text class="s" x="1040" y="158" text-anchor="middle">Boundary geometry</text>
  <line class="a" x1="1135" y1="130" x2="1165" y2="130"/>
  <rect class="box" x="1175" y="70" width="200" height="120" fill="#e0e7ff" stroke="#4f46e5"/><text class="t" x="1275" y="106" text-anchor="middle">Verified handoff</text><text class="s" x="1275" y="136" text-anchor="middle">100 NPZ + 100 JSON</text><text class="s" x="1275" y="158" text-anchor="middle">202 checksums</text>
  <text class="s" x="700" y="235" text-anchor="middle">CFD cluster → checksum verification → private Mac backup → separate M10 cluster</text>
</svg>
