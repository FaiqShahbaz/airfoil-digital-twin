[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airfoil-digital-twin"
version = "0.1.0"
description = "Local-first airfoil CFD surrogate and digital twin scaffold"
requires-python = ">=3.11"
dependencies = [
    "numpy<2",
    "scipy",
    "matplotlib",
    "pyyaml",
    "torch",
    "torch-geometric",
]

[project.optional-dependencies]
dashboard = [
    "streamlit",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
